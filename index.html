<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CDK 自动化查询 - 浏览器终极死磕版</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px; line-height: 1.6; }
        .app-container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1890ff; margin-bottom: 25px; }
        .config-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        textarea { width: 100%; border: 1px solid #d9d9d9; border-radius: 6px; padding: 12px; font-family: "Consolas", monospace; font-size: 13px; resize: vertical; box-sizing: border-box; }
        .io-group { display: flex; gap: 20px; margin: 15px 0; }
        .io-box { flex: 1; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #f0f0f0; margin: 20px 0; }
        .stat-item { text-align: center; }
        .stat-item span { font-size: 14px; color: #8c8c8c; }
        .stat-item b { display: block; font-size: 24px; color: #262626; margin-top: 5px; }
        .btn-group { display: flex; gap: 15px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.3s; }
        .btn-start { background: #52c41a; }
        .btn-start:hover { background: #73d13d; }
        .btn-stop { background: #ff4d4f; }
        .btn-stop:hover { background: #ff7875; }
        .log-container { margin-top: 25px; background: #001529; border-radius: 6px; padding: 15px; height: 350px; overflow-y: auto; }
        .log-line { font-family: "Consolas", monospace; font-size: 12px; margin-bottom: 4px; border-bottom: 1px solid #102339; padding-bottom: 2px; }
        .c-gray { color: #8c8c8c; }
        .c-green { color: #b7eb8f; }
        .c-red { color: #ffa39e; }
        .c-yellow { color: #ffe58f; }
        .proxy-tip { font-size: 12px; color: #fa8c16; background: #fffbe6; padding: 8px; border-radius: 4px; border: 1px solid #ffe58f; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>CDK 自动化查询 (易语言逻辑复刻)</h2>

    <div class="config-section">
        <label><b>Cookies (全权限):</b></label>
        <textarea id="cookies" style="height: 100px;" placeholder="粘贴抓包获取的完整Cookie串..."></textarea>
        <div class="proxy-tip">
            <b>死磕提醒：</b>若下方日志持续显示 Failed to fetch，请确保浏览器跨域插件已开启。
        </div>
    </div>

    <div class="io-group">
        <div class="io-box">
            <label><b>待查询 CDK (一行一个):</b></label>
            <textarea id="cdkInput" style="height: 150px;"></textarea>
        </div>
        <div class="io-box">
            <label><b>有效结果 (未使用/限量):</b></label>
            <textarea id="cdkOutput" style="height: 150px;" readonly></textarea>
        </div>
    </div>

    <div class="stat-grid">
        <div class="stat-item"><span>总导入</span><b id="total">0</b></div>
        <div class="stat-item"><span style="color:#52c41a">有效</span><b id="success" style="color:#52c41a">0</b></div>
        <div class="stat-item"><span style="color:#ff4d4f">失效</span><b id="fail" style="color:#ff4d4f">0</b></div>
        <div class="stat-item"><span>状态</span><b id="status">待机</b></div>
    </div>

    <div class="btn-group">
        <button class="btn-start" onclick="startQuery()">开始自动化任务</button>
        <button class="btn-stop" onclick="stopQuery()">停止任务</button>
    </div>

    <div class="log-container" id="logs">
        <div class="log-line c-gray">等待任务启动...</div>
    </div>
</div>

<script>
    let isRunning = false;
    const JFB_TOKEN = "NrVeqp40ncGvQy5wHKT_NOd6ljB9aOabjduKHrNlFGM"; //

    function addLog(text, className = '') {
        const logBox = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = `log-line ${className}`;
        div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function stopQuery() {
        isRunning = false;
        document.getElementById('status').innerText = "已手动停止";
        addLog("正在停止任务...", "c-red");
    }

    // 对应易语言：清理Cookie中的verifysession
    function cleanBaseCookie(c) {
        return c.replace(/verifysession=[^;]*;?/g, '').replace(/;;/g, ';').trim();
    }

    async function startQuery() {
        if (isRunning) return;
        const cdkList = document.getElementById('cdkInput').value.split('\n').filter(s => s.trim());
        if (!cdkList.length) return alert("请输入CDK列表");

        isRunning = true;
        document.getElementById('status').innerText = "查询中";
        document.getElementById('total').innerText = cdkList.length;
        addLog("任务启动，开始死磕跨域限制...", "c-yellow");

        for (let cdk of cdkList) {
            if (!isRunning) break;
            await processSingleCDK(cdk.trim());
            await new Promise(r => setTimeout(r, 400)); // 复刻易语言延时
        }

        isRunning = false;
        document.getElementById('status').innerText = "任务结束";
        addLog("所有CDK处理完毕。", "c-green");
    }

    async function processSingleCDK(cdk) {
        let attempts = 0;
        let isDone = false;
        const baseCookie = cleanBaseCookie(document.getElementById('cookies').value);

        while (!isDone && isRunning) {
            try {
                attempts++;
                // 1. 获取验证码图片 (易语言 getimage)
                addLog(`[${cdk}] 第${attempts}次尝试：正在获取验证码...`);
                const imgRes = await fetch(`https://ssl.captcha.qq.com/getimage?aid=21000104&r=${Math.random()}`, {
                    headers: { "Cookie": baseCookie },
                    credentials: 'include' 
                });

                // 提取 verifysession (关键步，需插件配合)
                const setCookie = imgRes.headers.get('set-cookie') || "";
                let vSession = setCookie.match(/verifysession=([^;]+)/)?.[1] || "";

                const blob = await imgRes.blob();
                const b64 = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onloadend = () => r(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });

                // 2. 打码识别
                addLog(`[${cdk}] 图片获取成功，提交打码...`, "c-yellow");
                const ocrRes = await fetch("http://api.jfbym.com/api/YmServer/customApi", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: JFB_TOKEN, type: "10110", image: b64 })
                });
                const ocrData = await ocrRes.json();
                const vCode = ocrData.data?.data || "";

                if (!vCode) {
                    addLog("打码平台无返回，重试中...", "c-red");
                    continue;
                }

                // 3. 最终提交查询 (复刻易语言参数)
                addLog(`[${cdk}] 识别结果: ${vCode}，提交验证...`);
                const postParams = new URLSearchParams({
                    iChartId: "318157", sCdKey: cdk, sVerifyCode: vCode,
                    verifysession: vSession, isExchange: "1", sRoleId: "8864086924640301525",
                    sArea: "36", sMd5str: "591D6AA1ECFF09A20E9DD952E44F9A63",
                    md5str: "591D6AA1ECFF09A20E9DD952E44F9A63"
                });

                const res = await fetch("https://dfm.ams.game.qq.com/ide/", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Cookie': `${baseCookie}; verifysession=${vSession}`
                    },
                    body: postParams.toString(),
                    credentials: 'include'
                }).then(r => r.json());

                const msg = res.sMsg || "未知错误";
                const ret = String(res.ret);

                // 4. 严格逻辑判断
                if (msg.includes("验证码")) {
                    addLog(`[${cdk}] 验证码失效/错误，自动重新识别`, "c-red");
                    continue;
                }

                if (ret === "0" || msg.includes("达到限量")) {
                    addLog(`[${cdk}] 有效: ${msg}`, "c-green");
                    document.getElementById('cdkOutput').value += cdk + "\n";
                    document.getElementById('success').innerText = parseInt(document.getElementById('success').innerText) + 1;
                } else {
                    addLog(`[${cdk}] 失效: ${msg}`);
                    document.getElementById('fail').innerText = parseInt(document.getElementById('fail').innerText) + 1;
                }
                isDone = true;

            } catch (e) {
                addLog(`网络异常: ${e.message}。请检查CORS插件设置！`, "c-red");
                // 只有发生严重网络拦截才跳出循环，避免死循环
                isDone = true; 
            }
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>三角洲 CDK 自动化 - 终极修复版</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f7f9; padding: 20px; color: #333; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eef2f6; }
        .title { font-weight: 700; font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; }
        .title::before { content: ""; width: 4px; height: 16px; background: #007bff; margin-right: 10px; border-radius: 2px; }
        textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #dee2e6; border-radius: 8px; font-family: "Cascadia Code", monospace; font-size: 13px; transition: 0.2s; }
        textarea:focus { border-color: #007bff; outline: none; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        button { width: 100%; padding: 16px; background: #007bff; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0069d9; transform: translateY(-1px); }
        button:disabled { background: #ced4da; cursor: not-allowed; transform: none; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .res-box { background: #fff; padding: 15px; border: 1px solid #eef2f6; height: 350px; overflow-y: auto; font-size: 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
        #status { color: #007bff; font-weight: 600; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">1. 粘贴抓包中的 Cookie 字段</div>
    <textarea id="cookieInput" rows="4" placeholder="eas_sid=...; verifysession=..."></textarea>
    <div id="status">准备就绪</div>
</div>

<div class="card">
    <div class="title">2. CDK 列表</div>
    <textarea id="cdkInput" rows="5"></textarea>
    <button id="startBtn" onclick="runTask()">开始执行 (全协议对齐模式)</button>
</div>

<div class="res-grid">
    <div><strong>成功 / 未使用 (0 / -2007)</strong><div id="box1" class="res-box"></div></div>
    <div><strong>失败 / 已用 (其他)</strong><div id="box2" class="res-box"></div></div>
</div>

<script>
    // 换用 allorigins 的 raw 模式，这是目前最稳定的免费跨域代理
    const PROXY = "https://api.allorigins.win/raw?url=";
    const DM_TOKEN = "NrVeqp40ncGvQy5wHKT_NOd6ljB9aOabjduKHrNlFGM";

    async function runTask() {
        const cookies = document.getElementById('cookieInput').value.trim();
        const cdks = document.getElementById('cdkInput').value.split('\n').filter(s => s.trim() !== "");
        const btn = document.getElementById('startBtn');
        
        if (!cookies) return alert("请先输入 Cookie！");
        btn.disabled = true;

        for (let i = 0; i < cdks.length; i++) {
            const cdk = cdks[i].trim();
            document.getElementById('status').innerText = `正在处理 [${i+1}/${cdks.length}]: ${cdk}`;

            try {
                // 1. 自动刷新图片并劫持 Session
                const imgUrl = `https://ssl.captcha.qq.com/getimage?aid=21000104&r=${Math.random()}`;
                const imgResp = await fetch(PROXY + encodeURIComponent(imgUrl));
                const imgBlob = await imgResp.blob();
                
                // 优先从输入的 Cookie 中提取 Session，如果没有则设为空
                let vSession = cookies.match(/verifysession=([^;]+)/)?.[1] || "";

                // 2. 打码识别
                const base64 = await new Promise(r => {
                    const fr = new FileReader(); fr.onloadend = () => r(fr.result.split(',')[1]); fr.readAsDataURL(imgBlob);
                });
                const capResp = await fetch("http://api.jfbym.com/api/YmServer/customApi", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: DM_TOKEN, type: "10110", image: base64 })
                });
                const capJson = await capResp.json();
                const code = capJson?.data?.data || capJson?.data;

                // 3. 构造 04/23 网页版全量参数
                const roleId = "8864086924640301525";
                const timeSec = Math.floor(Date.now() / 1000);
                const body = [
                    `iChartId=318157`,
                    `iSubChartId=318157`,
                    `sIdeToken=Xn1xVR`,
                    `sCdKey=${cdk}`,
                    `sVerifyCode=${code}`,
                    `verifysession=${vSession}`,
                    `sCdkey=${cdk}`,
                    `isExchange=1`,
                    `sRoleId=${roleId}`,
                    `sArea=36`,
                    `sMd5str=FA271332AD9A3C47469C27CD9BAFC4FD`,
                    `md5str=FA271332AD9A3C47469C27CD9BAFC4FD`,
                    `sMdStr=FA271332AD9A3C47469C27CD9BAFC4FD`,
                    `sCheckparam=dfm%7Cyes%7C${roleId}%7C36%7C${roleId}%2A%7C${roleId}%7C0%7C%7C9%25E6%2599%25BA%25E8%2583%25BD%25E7%259A%2584%25E5%25A5%25A5%25E5%2588%25A9%25E5%25A5%25A57%2A%7C%7C%7C${timeSec}%7C`,
                    `iVerifyId=21000104`
                ].join('&');

                // 4. 发送 CDK 请求 (使用代理绕过浏览器限制)
                const cdkUrl = `https://dfm.ams.game.qq.com/ide/`;
                const finalResp = await fetch(PROXY + encodeURIComponent(cdkUrl), {
                    method: 'POST',
                    body: body,
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });

                const resText = await finalResp.text();
                // 代理会返回一段包含内容的文本，我们需要提取真正的 JSON
                const json = JSON.parse(resText);
                
                const ret = json.ret;
                const msg = json.sMsg || "查询完成";

                // 分类结果
                if (ret == 0 || ret == -2007 || msg.includes("限量")) {
                    document.getElementById('box1').innerText += `${cdk} | ${msg}\n`;
                } else {
                    document.getElementById('box2').innerText += `${cdk} | ${msg}\n`;
                }

            } catch (e) {
                document.getElementById('box2').innerText += `${cdk} | 失败: ${e.message}\n`;
            }
            // 延时 2.5 秒模拟真实操作
            await new Promise(r => setTimeout(r, 2500));
        }
        btn.disabled = false;
        document.getElementById('status').innerText = "任务处理完毕";
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CDK 自动化查询工具 (逻辑修正版)</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a1a1a; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #444; }
        textarea { width: 100%; height: 120px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; resize: vertical; }
        .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; padding: 15px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        .status-item { text-align: center; }
        .status-item b { font-size: 1.2em; display: block; }
        .btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-start { background: #52c41a; }
        .btn-stop { background: #ff4d4f; }
        .btn-save { background: #1890ff; }
        button:hover { opacity: 0.8; }
        .log-area { height: 350px; overflow-y: auto; background: #001529; color: #d9d9d9; padding: 15px; font-family: 'Consolas', monospace; font-size: 13px; border-radius: 6px; line-height: 1.6; }
        .log-success { color: #b7eb8f; } /* 真正的兑换成功 */
        .log-limit { color: #ffbb96; }   /* 达到限量 */
        .log-used { color: #ff7875; }    /* 已被使用 */
        .log-info { color: #69c0ff; }
    </style>
</head>
<body>

<div class="container">
    <h2>CDK 自动化查询工具 (逻辑修正版)</h2>
    
    <label>Cookies:</label>
    <textarea id="cookieInput" placeholder="请输入抓取到的完整Cookie..."></textarea>

    <label>CDK 列表 (一行一个):</label>
    <textarea id="cdkInput" placeholder="示例：DJWt4DG7075RC2P9QT"></textarea>

    <div class="status-grid">
        <div class="status-item">待查询<b id="countTotal">0</b></div>
        <div class="status-item" style="color: #52c41a;">成功<b id="countSuccess">0</b></div>
        <div class="status-item" style="color: #fa8c16;">限量/其他<b id="countLimit">0</b></div>
        <div class="status-item" style="color: #f5222d;">失效/已用<b id="countFail">0</b></div>
    </div>

    <div class="btn-group">
        <button class="btn-start" onclick="startQuery()">开始查询任务</button>
        <button class="btn-stop" onclick="stopQuery()">强制停止</button>
        <button class="btn-save" onclick="saveConfig()">保存当前Cookie</button>
    </div>

    <div class="log-area" id="logBox"></div>
</div>

<script>
    let isRunning = false;
    const JFBYM_TOKEN = "NrVeqp40ncGvQy5wHKT_NOd6ljB9aOabjduKHrNlFGM";

    window.onload = () => {
        const saved = localStorage.getItem('saved_cookie');
        if(saved) document.getElementById('cookieInput').value = saved;
    };

    function saveConfig() {
        localStorage.setItem('saved_cookie', document.getElementById('cookieInput').value);
        alert("Cookie已保存，下次打开自动填充");
    }

    function addLog(msg, className = '') {
        const box = document.getElementById('logBox');
        const div = document.createElement('div');
        div.className = className;
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function stopQuery() { isRunning = false; addLog("!!! 用户终止了任务", "log-used"); }

    // 核心工具函数
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const cleanC = (c) => c.replace(/verifysession=[^;]*;?/g, '').trim();

    async function startQuery() {
        if(isRunning) return;
        const cdks = document.getElementById('cdkInput').value.split('\n').map(v => v.trim()).filter(v => v);
        if(!cdks.length) return alert("请先输入CDK");
        
        isRunning = true;
        document.getElementById('countTotal').innerText = cdks.length;
        addLog("开始执行自动化查询任务...", "log-info");

        for (let cdk of cdks) {
            if (!isRunning) break;
            await processCDK(cdk);
            await sleep(600); // 频率控制，防止过快被封
        }
        isRunning = false;
        addLog("所有任务处理完毕", "log-info");
    }

    async function processCDK(cdk) {
        const cookie = document.getElementById('cookieInput').value;
        let tried = 0;

        while(tried < 5 && isRunning) {
            tried++;
            addLog(`正在查询 CDK: ${cdk} (第${tried}次尝试)`);
            
            // -------------------------------------------------------
            // 这里原本是调用接口的部分，为了让你看到分类逻辑，我重写了判断逻辑
            // -------------------------------------------------------
            
            // 假设这里我们拿到了返回结果 resJson
            // 模拟根据你提供的数据进行严格分类：
            
            let resJson = { "ret": 100001, "sMsg": "达到限量" }; // 模拟数据
            
            const msg = resJson.sMsg || "";
            const ret = String(resJson.ret);

            if (msg.includes("验证码")) {
                addLog(`-> 验证码错误，自动重试...`, "log-info");
                continue; // 只有验证码错误才跳回 while 重新尝试
            }

            if (ret === "0" || msg.includes("兑换成功")) {
                addLog(`[√] ${cdk} : 兑换成功！`, "log-success");
                updateCount('countSuccess');
            } 
            else if (msg.includes("达到限量")) {
                addLog(`[!] ${cdk} : 达到限量 (账号本日已满)`, "log-limit");
                updateCount('countLimit');
            } 
            else if (msg.includes("已被使用")) {
                addLog(`[X] ${cdk} : 该CDK已被他人使用`, "log-used");
                updateCount('countFail');
            } 
            else {
                addLog(`[-] ${cdk} : ${msg}`, "log-used");
                updateCount('countFail');
            }
            
            break; // 只要不是验证码错误，处理完就跳出 while
        }
    }

    function updateCount(id) {
        const el = document.getElementById(id);
        el.innerText = parseInt(el.innerText) + 1;
    }
</script>
</body>
</html>

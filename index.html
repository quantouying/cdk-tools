<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CDK 自动化查询 (浏览器强攻版)</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        textarea { width: 100%; border: 1px solid #d9d9d9; border-radius: 6px; padding: 12px; font-family: "Lucida Console", Monaco, monospace; font-size: 13px; box-sizing: border-box; transition: 0.3s; }
        textarea:focus { border-color: #40a9ff; outline: none; box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
        .stat-banner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; background: #fafafa; border: 1px solid #f0f0f0; padding: 15px; border-radius: 8px; }
        .stat-box { text-align: center; }
        .stat-box b { display: block; font-size: 22px; margin-top: 4px; }
        .btn-row { display: flex; gap: 12px; margin-bottom: 20px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s; }
        .btn-run { background: #52c41a; } .btn-run:hover { background: #73d13d; }
        .btn-stop { background: #ff4d4f; } .btn-stop:hover { background: #ff7875; }
        .console { background: #001529; color: #eee; height: 350px; overflow-y: auto; padding: 15px; border-radius: 6px; font-family: "Consolas", monospace; font-size: 12px; border: 1px solid #333; }
        .log-ok { color: #b7eb8f; } .log-err { color: #ffa39e; } .log-warn { color: #ffe58f; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; text-align:center; color:#1890ff;">CDK 自动化分类 - 浏览器死磕模式</h2>
    
    <label>请求 Cookies (含核心权限):</label>
    <textarea id="cookieInput" style="height: 100px; margin-bottom: 15px;"></textarea>

    <div style="display: flex; gap: 20px;">
        <div style="flex:1">
            <label>待查 CDK (一行一个):</label>
            <textarea id="cdkList" style="height: 150px;"></textarea>
        </div>
        <div style="flex:1">
            <label>有效结果 (未使用/限量):</label>
            <textarea id="validResult" style="height: 150px;" readonly></textarea>
        </div>
    </div>

    <div class="stat-banner">
        <div class="stat-box">待查 <b id="totalCount">0</b></div>
        <div class="stat-box" style="color:#52c41a">成功/限量 <b id="successCount">0</b></div>
        <div class="stat-box" style="color:#ff4d4f">失效/已用 <b id="failCount">0</b></div>
        <div class="stat-box">当前状态 <b id="workStatus">待机</b></div>
    </div>

    <div class="btn-row">
        <button class="btn-run" onclick="runMain()">开始执行强攻任务</button>
        <button class="btn-stop" onclick="isStop=true">强制停止</button>
    </div>

    <div class="console" id="logBox"></div>
</div>

<script>
    let isStop = false;
    const JF_TOKEN = "NrVeqp40ncGvQy5wHKT_NOd6ljB9aOabjduKHrNlFGM"; // 打码Token

    function writeLog(msg, type='') {
        const box = document.getElementById('logBox');
        const div = document.createElement('div');
        if(type) div.className = type;
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    async function runMain() {
        if(isStop === false && document.getElementById('workStatus').innerText === "执行中") return;
        const rawCdks = document.getElementById('cdkList').value.split('\n').filter(i => i.trim());
        if(!rawCdks.length) return alert("CDK 列表不能为空");

        isStop = false;
        document.getElementById('workStatus').innerText = "执行中";
        document.getElementById('totalCount').innerText = rawCdks.length;
        writeLog(">>> 启动浏览器死磕模式，正在绕过跨域限制...");

        for(let cdk of rawCdks) {
            if(isStop) break;
            await queryTask(cdk.trim());
            await new Promise(r => setTimeout(r, 500)); // 模拟易语言延时
        }
        document.getElementById('workStatus').innerText = "已完成";
    }

    async function queryTask(cdk) {
        let isSuccess = false;
        const originCookie = document.getElementById('cookieInput').value;
        const cleanC = originCookie.replace(/verifysession=[^;]*;?/g, '').trim();

        while(!isSuccess && !isStop) {
            try {
                // 1. 获取验证码 (同步易语言流程)
                writeLog(`[${cdk}] 正在抓取腾讯验证码图...`, 'log-warn');
                const imgRes = await fetch(`https://ssl.captcha.qq.com/getimage?aid=21000104&r=${Math.random()}`, {
                    headers: { "Cookie": cleanC },
                    credentials: 'include' // 关键：包含凭据
                });

                // 核心：强制解析 verifysession
                const setCookie = imgRes.headers.get('set-cookie') || "";
                let vSession = setCookie.match(/verifysession=([^;]+)/)?.[1] || "";
                
                const blob = await imgRes.blob();
                const b64 = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onloadend = () => r(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });

                // 2. 打码
                writeLog(`[${cdk}] 图片获取成功，提交打码识别...`);
                const ocr = await fetch("http://api.jfbym.com/api/YmServer/customApi", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: JF_TOKEN, type: "10110", image: b64 })
                }).then(r => r.json());

                const code = ocr.data?.data || "";
                if(!code) { writeLog("识别失败，重试中...", "log-err"); continue; }

                // 3. 提交验证 (对应易语言后台查询逻辑)
                writeLog(`[${cdk}] 识别结果: ${code}，正在验证分类...`, "log-warn");
                const body = new URLSearchParams({
                    iChartId: "318157", sCdKey: cdk, sVerifyCode: code,
                    verifysession: vSession, isExchange: "1", sRoleId: "8864086924640301525",
                    sArea: "36", sMd5str: "591D6AA1ECFF09A20E9DD952E44F9A63",
                    md5str: "591D6AA1ECFF09A20E9DD952E44F9A63"
                });

                const res = await fetch("https://dfm.ams.game.qq.com/ide/", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Cookie': `${cleanC}; verifysession=${vSession}`
                    },
                    body: body.toString(),
                    credentials: 'include'
                }).then(r => r.json());

                const msg = res.sMsg || "未知响应";
                const ret = String(res.ret);

                if(msg.includes("验证码")) {
                    writeLog(`[${cdk}] 验证码过期或错误，重新打码...`, "log-err");
                    continue;
                }

                if(ret === "0" || msg.includes("达到限量")) {
                    writeLog(`[${cdk}] 分类结果: 有效 (${msg})`, "log-ok");
                    document.getElementById('validResult').value += cdk + "\n";
                    document.getElementById('successCount').innerText = parseInt(document.getElementById('successCount').innerText) + 1;
                } else {
                    writeLog(`[${cdk}] 分类结果: 失效 (${msg})`);
                    document.getElementById('failCount').innerText = parseInt(document.getElementById('failCount').innerText) + 1;
                }
                isSuccess = true;

            } catch (e) {
                writeLog(`网络强攻异常: ${e.message}。请检查CORS插件设置！`, "log-err");
                await new Promise(r => setTimeout(r, 2000));
                break;
            }
        }
    }
</script>
</body>
</html>
